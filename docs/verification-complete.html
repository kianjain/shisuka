<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verification Complete</title>
  <meta name="viewport" content="width=1100">
  <style>
    body {
      background: #000;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', Arial, sans-serif;
    }
    .verification-container {
      width: 1100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0;
      gap: 32px;
      position: relative;
      border-radius: 10px;
      background: transparent;
    }
    .verification-title {
      color: #fff;
      font-size: 48px;
      font-weight: 500;
      margin: 0;
      text-align: center;
      letter-spacing: 0.01em;
    }
    .verification-subtext {
      color: #bdbdbd;
      font-size: 22px;
      font-weight: 400;
      text-align: center;
      margin: 0;
      line-height: 1.3;
      letter-spacing: 0.01em;
    }
    .verification-button {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 32px;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: 400;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      text-decoration: none;
      display: inline-block;
    }
    .verification-button:hover {
      background: #f0f0f0;
    }
    @media (max-width: 1200px) {
      .verification-container {
        width: 95vw;
      }
      .verification-title {
        font-size: 6vw;
      }
      .verification-subtext {
        font-size: 2.2vw;
      }
    }
  </style>
</head>
<body>
  <div class="verification-container">
    <h1 class="verification-title">you are good to go!</h1>
    <p class="verification-subtext">
      The verification was complete and<br>
      you can now proceed with the log in
    </p>
    <a href="https://shisuka.com" class="verification-button">Homepage</a>
  </div>
</body>
</html>
