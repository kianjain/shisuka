<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verification Complete</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #000;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', Arial, sans-serif;
    }
    .verification-container {
      width: 80%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 32px 0;
      gap: 24px;
      position: relative;
      border-radius: 10px;
      background: transparent;
      box-sizing: border-box;
    }
    .verification-title {
      color: #fff;
      font-size: 1.6rem;
      font-weight: 500;
      margin: 0;
      text-align: center;
      letter-spacing: 0.01em;
    }
    .verification-subtext {
      color: #bdbdbd;
      font-size: 1rem;
      font-weight: 400;
      text-align: center;
      margin: 0;
      line-height: 1.4;
      letter-spacing: 0.01em;
    }
    .verification-button {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 32px;
      padding: 14px 0;
      font-size: 1rem;
      font-weight: 400;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      text-decoration: none;
      display: block;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .verification-button:hover {
      background: #f0f0f0;
    }
    @media (min-width: 600px) {
      .verification-container {
        max-width: 420px;
        padding: 40px 0;
        gap: 28px;
      }
      .verification-title {
        font-size: 1.9rem;
      }
      .verification-subtext {
        font-size: 1.08rem;
      }
      .verification-button {
        font-size: 1.08rem;
        max-width: 320px;
      }
    }
    @media (min-width: 900px) {
      .verification-container {
        max-width: 420px;
        padding: 48px 0;
        gap: 32px;
      }
      .verification-title {
        font-size: 2.1rem;
      }
      .verification-subtext {
        font-size: 1.12rem;
      }
      .verification-button {
        font-size: 1.12rem;
        max-width: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="verification-container">
    <h1 class="verification-title">you are good to go!</h1>
    <p class="verification-subtext">
      The verification was complete and<br>
      you can now proceed with the log in
    </p>
    <a href="https://shisuka.com" class="verification-button">Homepage</a>
  </div>
</body>
</html>
