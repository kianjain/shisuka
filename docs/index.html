<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="no">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="no">
    <title>Redirecting...</title>
    <script>
        // If there's a hash in the URL, redirect to update.html
        if (window.location.hash) {
            window.location.href = '/update.html' + window.location.hash;
        } else {
            // If there's a code in the URL, redirect to update.html with the code
            const queryParams = new URLSearchParams(window.location.search);
            const code = queryParams.get('code');
            if (code) {
                window.location.href = '/update.html?code=' + code;
            }
        }
    </script>
</head>
<body>
    <p>Redirecting to password reset page...</p>
</body>
</html>
