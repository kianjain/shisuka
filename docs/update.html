<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - Rumori</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 100%;
            padding: 20px;
            background-color: #111;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #888;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #222;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #666;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        .error {
            color: #ff3b30;
            margin-top: 8px;
            font-size: 14px;
        }
        .success {
            color: #34c759;
            margin-top: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Update Password</h1>
        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>
        <form id="updatePasswordForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required minlength="6">
            </div>
            <button type="submit" id="updateButton">Update Password</button>
        </form>
    </div>

    <script>
        const supabase = window.supabase.createClient(
            'https://ktgbpungskpjngopzarg.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0Z2JwdW5nc2twam5nb3B6YXJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM1ODU1MjgsImV4cCI6MjA1OTE2MTUyOH0.OhnWtlSyX0bUze2mboyA0Mu9wzZt0JuiPNppy0Ph7To'
        );

        // Debug logging
        console.log('Full URL:', window.location.href);
        console.log('Hash:', window.location.hash);
        console.log('Search:', window.location.search);

        // Get the code from either the URL hash or query parameters
        const hash = window.location.hash.substring(1); // Remove the # character
        const searchParams = new URLSearchParams(window.location.search);
        const code = searchParams.get('code');
        const hashParams = new URLSearchParams(hash);
        const accessToken = hashParams.get('access_token');
        const type = hashParams.get('type');

        console.log('Code:', code);
        console.log('Hash:', hash);
        console.log('Access Token:', accessToken);
        console.log('Type:', type);

        let session = null;

        // Handle both hash-based and code-based auth
        if (code) {
            // Handle code-based auth (from app)
            console.log('Attempting to exchange code for session...');
            supabase.auth.exchangeCodeForSession(code)
                .then(({ data, error }) => {
                    if (error) {
                        console.error('Error exchanging code for session:', error);
                        showError('Invalid or expired reset link. Please request a new password reset.');
                        document.getElementById('updateButton').disabled = true;
                    } else {
                        console.log('Session established successfully from code:', data);
                        session = data.session;
                        document.getElementById('updateButton').disabled = false;
                    }
                })
                .catch(error => {
                    console.error('Unexpected error during code exchange:', error);
                    showError('An unexpected error occurred. Please try again or request a new password reset.');
                    document.getElementById('updateButton').disabled = true;
                });
        } else if (accessToken && type === 'recovery') {
            // Handle hash-based auth (from Supabase web)
            console.log('Attempting to set session from hash...');
            supabase.auth.setSession({
                access_token: accessToken,
                refresh_token: hashParams.get('refresh_token')
            })
            .then(({ data, error }) => {
                if (error) {
                    console.error('Error setting session:', error);
                    showError('Invalid or expired reset link. Please request a new password reset.');
                    document.getElementById('updateButton').disabled = true;
                } else {
                    console.log('Session established successfully from hash:', data);
                    session = data.session;
                    document.getElementById('updateButton').disabled = false;
                }
            })
            .catch(error => {
                console.error('Unexpected error during session setup:', error);
                showError('An unexpected error occurred. Please try again or request a new password reset.');
                document.getElementById('updateButton').disabled = true;
            });
        } else {
            showError('Invalid or expired reset link. Please request a new password reset.');
            document.getElementById('updateButton').disabled = true;
        }

        document.getElementById('updatePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const updateButton = document.getElementById('updateButton');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            try {
                updateButton.disabled = true;
                updateButton.textContent = 'Updating...';
                
                // Ensure we have a session before updating password
                if (!session) {
                    throw new Error('No active session. Please try the reset link again.');
                }
                
                const { data, error } = await supabase.auth.updateUser({
                    password: password
                });
                
                if (error) {
                    throw error;
                }
                
                showSuccess('Password updated successfully! You can now close this window and log in with your new password.');
                updateButton.textContent = 'Password Updated';
            } catch (error) {
                console.error('Error updating password:', error);
                showError(error.message);
                updateButton.disabled = false;
                updateButton.textContent = 'Update Password';
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('success').style.display = 'none';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('error').style.display = 'none';
        }
    </script>
</body>
</html>
